# Oracle Cloud Always Free, single ARM instance, Mumbai.
#
# Postgres and the app share the box, so the database is never published to the
# host — only the compose network can reach it. Caddy terminates TLS and is the
# one service bound to a public port, with Cloudflare proxying in front of it.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phonesemangao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-phonesemangao}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Read-only mount for the nightly pg_dump to write into.
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-phonesemangao}']
      interval: 10s
      timeout: 5s
      retries: 5
    # No `ports:` on purpose. Publishing 5432 on an Oracle instance exposes the
    # database to the internet; the app reaches it over the compose network.

  # One-shot. `docker compose run --rm migrate` before rolling the app forward.
  # Kept out of the default `up` so a migration never runs implicitly.
  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-phonesemangao}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-phonesemangao}
    depends_on:
      db:
        condition: service_healthy
    profiles: ['tools']

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-phonesemangao}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-phonesemangao}
    depends_on:
      db:
        condition: service_healthy
    # Bound to loopback only. Caddy reaches it over the compose network; the
    # 127.0.0.1 binding exists purely so the host crontab can curl the cron
    # routes. Written as 0.0.0.0:3000:3000 it would be open to the internet,
    # bypassing TLS and Cloudflare entirely.
    ports:
      - '127.0.0.1:3000:3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
