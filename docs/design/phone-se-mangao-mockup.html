document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;display:flex;flex-direction:column\">\n\n  <header style=\"position:sticky;top:0;z-index:50;background:rgba(16,32,25,0.86);backdrop-filter:blur(10px);border-bottom:1px solid #294C3B\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer;display:flex;flex-direction:column;line-height:1;flex-shrink:0\">\n        <span style=\"font-family:'Marcellus',serif;font-size:23px;letter-spacing:.06em;color:#F3EBDC\">PHONE SE MANGAO<\u002Fspan>\n        <span style=\"font-size:10px;letter-spacing:.34em;color:#94A69A;margin-top:5px;text-transform:uppercase\">Fresh · Daily · At your door<\u002Fspan>\n      <\u002Fdiv>\n      <form sc-camel-on-submit=\"{{ onSearchSubmit }}\" style=\"flex:1;min-width:200px;display:flex;align-items:center;gap:12px;background:#F3EEE2;border:1px solid #C8A24B;border-radius:999px;padding:11px 8px 11px 18px;box-shadow:0 2px 14px rgba(0,0,0,0.25)\">\n        <span style=\"color:#0F2118;font-size:16px\">⌕<\u002Fspan>\n        <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onSearch }}\" placeholder=\"Search mangoes, tomatoes, atta…\" style=\"border:none;background:transparent;flex:1;font-size:15px;color:#132019\">\n        <button type=\"submit\" style=\"flex-shrink:0;background:#132A20;color:#D4B15E;border:none;border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:600;letter-spacing:.02em;cursor:pointer\" style-hover=\"background:#0C1712;color:#D4B15E\">Search<\u002Fbutton>\n      <\u002Fform>\n      <div sc-camel-on-click=\"{{ goCart }}\" style=\"cursor:pointer;position:relative;display:flex;align-items:center;gap:9px;background:#C8A24B;color:#132019;border-radius:999px;padding:11px 20px;font-weight:600;font-size:14px\" style-hover=\"background:#B08A3C;color:#fff\">\n        <span>Cart<\u002Fspan>\n        <span style=\"background:#D4B15E;color:#2a1608;border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px\">{{ cartCount }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"flex:1;width:100%\">\n\n    <!-- ===================== HOME ===================== -->\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-screen-label=\"Home\" style=\"animation:omFade .4s ease\">\n      <section style=\"max-width:1240px;margin:0 auto;padding:44px 22px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:38px;align-items:center\">\n        <div style=\"animation:omUp .5s ease\">\n          <div style=\"display:inline-flex;align-items:center;gap:8px;background:#20392D;color:#C8A24B;border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase\">Morning · Afternoon · Evening delivery<\u002Fdiv>\n          <h1 style=\"font-family:'Marcellus',serif;font-size:clamp(46px,6.2vw,82px);line-height:0.97;margin:18px 0 0;color:#F5EDDE;font-weight:400;letter-spacing:-0.01em;text-shadow:0 2px 44px rgba(0,0,0,0.55)\">Sun-ripened.<br>Hand-picked.<br><span style=\"color:#D4B15E\">At your door by tonight.<\u002Fspan><\u002Fh1>\n          <p style=\"font-size:18px;line-height:1.6;color:#A9B7AC;max-width:460px;margin:20px 0 30px\">Fruit still warm from the sun, vegetables pulled at dawn, and every grocery staple — chosen by hand and carried to your door in the slot you choose.<\u002Fp>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px\">\n            <button sc-camel-on-click=\"{{ goShop }}\" style=\"background:#C8A24B;color:#132019;border:none;border-radius:999px;padding:15px 30px;font-size:15.5px;font-weight:600;cursor:pointer;letter-spacing:.02em\" style-hover=\"background:#B08A3C\">Start shopping<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onWhatsApp }}\" style=\"background:#182E24;color:#F3EBDC;border:1px solid #305640;border-radius:999px;padding:15px 26px;font-size:15px;font-weight:600;cursor:pointer\" style-hover=\"border-color:#C8A24B\">Order on WhatsApp<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"background:#182E24;border:1px solid #294C3B;border-radius:14px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;max-width:420px\">\n            <span style=\"font-size:14px;color:#94A69A;flex-shrink:0\">Deliver to<\u002Fspan>\n            <input value=\"{{ pin }}\" sc-camel-on-change=\"{{ onPinInput }}\" placeholder=\"Enter 6-digit pincode\" maxlength=\"6\" style=\"border:none;flex:1;font-size:15px;min-width:0\">\n            <button sc-camel-on-click=\"{{ onPinCheck }}\" style=\"background:#20392D;color:#C8A24B;border:none;border-radius:9px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer\" style-hover=\"background:#305640\">Check<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ pinMsg }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:12px;font-size:14px;font-weight:600;color:{{ pinColor }}\">{{ pinMsg }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"aspect-ratio:4/3.4;border-radius:22px;overflow:hidden;position:relative;border:1px solid #294C3B;box-shadow:inset 0 0 130px rgba(0,0,0,0.4);animation:omUp .6s ease\">\n          <image-slot id=\"heroBasket\" shape=\"rect\" placeholder=\"Drop your hero photo — a basket of fresh produce\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:1240px;margin:0 auto;padding:20px 22px 8px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n          <sc-for list=\"{{ slotPromise }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"background:#182E24;b e=\"background:#0C1712;color:#C3D0C6;margin-top:20px\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:44px 22px 30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px\">\n      <div>\n        <div style=\"font-family:'Marcellus',serif;font-size:20px;letter-spacing:.06em;color:#fff\">PHONE SE MANGAO<\u002Fdiv>\n        <p style=\"font-size:13.5px;line-height:1.6;margin:12px 0 0;color:#7E9186\">Fresh fruits, vegetables and grocery, delivered in your chosen time slot across the city.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#62766B;margin-bottom:12px\">Shop<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;font-size:14px\">\n          <a sc-camel-on-click=\"{{ onFruits }}\" style=\"cursor:pointer;color:#C3D0C6\">Fruits<\u002Fa>\n          <a sc-camel-on-click=\"{{ onVeg }}\" style=\"cursor:pointer;color:#C3D0C6\">Vegetables<\u002Fa>\n          <a sc-camel-on-click=\"{{ onGrocery }}\" style=\"cursor:pointer;color:#C3D0C6\">Grocery<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#62766B;margin-bottom:12px\">Help<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;font-size:14px\">\n          <a sc-camel-on-click=\"{{ onWhatsApp }}\" style=\"cursor:pointer;color:#C3D0C6\">WhatsApp us<\u002Fa>\n          <span style=\"color:#7E9186\">Delivery slots &amp; areas<\u002Fspan>\n          <span style=\"color:#7E9186\">Returns if not fresh<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#62766B;margin-bottom:12px\">Pay with<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.8;color:#7E9186\">UPI · Cards · Netbanking<br>Cash on delivery<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #2E2519;padding:18px 22px;text-align:center;font-size:12.5px;color:#62766B\">© 2026 Phone Se Mangao · Made fresh, every morning.<\u002Fdiv>\n  <\u002Ffooter>\n\n  <a sc-camel-on-click=\"{{ onWhatsApp }}\" style=\"position:fixed;right:22px;bottom:22px;z-index:60;cursor:pointer;background:#25603a;color:#fff;border-radius:999px;padding:14px 22px;font-size:14.5px;font-weight:600;box-shadow:0 14px 30px -10px rgba(37,96,58,.6);display:flex;align-items:center;gap:9px\" style-hover=\"background:#1e4e2f;color:#fff\"><span style=\"width:9px;height:9px;border-radius:999px;background:#8fe0a6;display:inline-block\"><\u002Fspan>Chat on WhatsApp<\u002Fa>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:96px;z-index:70;background:#0C1712;color:#fff;padding:13px 22px;border-radius:999px;font-size:14.5px;font-weight:600;box-shadow:0 16px 34px -12px rgba(0,0,0,.5);animation:omToast 2.2s ease forwards\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.f = (n) => '₹' + Math.round(n).toLocaleString('en-IN');\n    this.cats = [\n      {slug:'fruits', name:'Fruits', tag:'Seasonal & sun-ripened', tint:['#7d5a2a','#183026'], ph:'fruits_flatlay'},\n      {slug:'vegetables', name:'Vegetables', tag:'Picked farm-fresh daily', tint:['#3f5a2c','#16281e'], ph:'veg_flatlay'},\n      {slug:'grocery', name:'Grocery', tag:'Pantry & daily staples', tint:['#6a532a','#182e24'], ph:'grocery_flatlay'},\n    ];\n    this.catBySlug = {}; this.cats.forEach(c=>this.catBySlug[c.slug]=c);\n    const P = (id,cat,name,ph,desc,variants)=>({id,cat,name,ph,desc,variants:variants.map((v,i)=>({id:id+'-v'+i,...v}))});\n    this.products = [\n      P('mango','fruits','Alphonso Mango','alphonso_mango','The king of mangoes — fragrant, fibreless and honey-sweet. Sourced from Ratnagiri farms.',[{label:'1 kg',price:399,mrp:499},{label:'500 g',price:210},{label:'1 dozen',price:640,mrp:720}]),\n      P('banana','fruits','Robusta Banana','robusta_banana','Naturally ripened, everyday energy. Great for smoothies and lunchboxes.',[{label:'1 dozen',price:60,mrp:72},{label:'6 pieces',price:34}]),\n      P('pomegranate','fruits','Pomegranate','pomegranate','Deep-red, juicy arils bursting with flavour. Hand-selected for ruby colour.',[{label:'1 kg',price:180,mrp:220},{label:'500 g',price:95}]),\n      P('kiwi','fruits','New Zealand Kiwi','nz_kiwi','Tangy, vitamin-C rich and perfectly firm. Imported and ripened to eat.',[{label:'3 pieces',price:99,mrp:120},{label:'6 pieces',price:189}]),\n      P('apple','fruits','Green Apple','green_apple','Crisp and tart Granny Smith apples. Waxed-free, straight from cold store.',[{label:'1 kg',price:220,mrp:260},{label:'4 pieces',price:120}]),\n      P('mosambi','fruits','Sweet Lime (Mosambi)','sweet_lime','Refreshing, juicy and easy to peel — the classic Indian summer citrus.',[{label:'1 kg',price:90,mrp:110}]),\n      P('tomato','vegetables','Farm Tomato','farm_tomato','Vine-ripened, firm and tangy. Perfect for gravies, salads and chutneys.',[{label:'1 kg',price:40,mrp:55},{label:'500 g',price:22}]),\n      P('onion','vegetables','Nashik Onion','nashik_onion','Pungent, layered and long-keeping. The backbone of every Indian kitchen.',[{label:'1 kg',price:45,mrp:60},{label:'2 kg',price:85}]),\n      P('potato','vegetables','Potato','potato','All-rounder spuds — smooth skin, ideal for curries, fries and mash.',[{label:'1 kg',price:38,mrp:48},{label:'2 kg',price:72}]),\n      P('spinach','vegetables','Palak (Spinach)','palak_bundle','Tender, iron-rich leaves washed and bundled fresh this morning.',[{label:'1 bundle',price:25,mrp:35},{label:'2 bundles',price:45}]),\n      P('cauliflower','vegetables','Cauliflower','cauliflower','Tight, snow-white florets. Great for sabzi, pakoras and roasts.',[{label:'1 piece',price:45,mrp:55}]),\n      P('peas','vegetables','Green Peas','green_peas','Sweet, plump shelled peas. Sorted and cleaned, ready to cook.',[{label:'500 g',price:60,mrp:75},{label:'1 kg',price:115}]),\n      P('rice','grocery','Basmati Rice','basmati_rice','Long-grain aged basmati with a rich aroma. Fluffs up beautifully.',[{label:'1 kg',price:145,mrp:170},{label:'5 kg',price:690,mrp:780}]),\n      P('dal','grocery','Toor Dal','toor_dal','Premium unpolished arhar dal — the base of everyday dal and sambar.',[{label:'1 kg',price:165,mrp:190},{label:'500 g',price:88}]),\n      P('oil','grocery','Sunflower Oil','sunflower_oil','Light, refined cooking oil. Heart-friendly and neutral in taste.',[{label:'1 litre',price:155,mrp:175},{label:'5 litre',price:740}]),\n      P('atta','grocery','Whole Wheat Atta','wheat_atta','Stone-ground chakki atta for soft, wholesome rotis every day.',[{label:'5 kg',price:265,mrp:310},{label:'10 kg',price:520}]),\n      P('sugar','grocery','Sugar','sugar','Fine, clean sulphur-free crystals for tea, sweets and baking.',[{label:'1 kg',price:48,mrp:58},{label:'5 kg',price:235}]),\n      P('tea','grocery','Assam Tea','assam_tea','Bold, malty CTC leaves for a strong cup of kadak chai.',[{label:'250 g',price:140,mrp:165},{label:'500 g',price:270}]),\n    ];\n    this.byId = {}; this.byCat = {fruits:[],vegetables:[],grocery:[]}; this.vIndex = {};\n    this.products.forEach(p=>{ this.byId[p.id]=p; this.byCat[p.cat].push(p); p.variants.forEach(v=>this.vIndex[v.id]={product:p,variant:v}); });\n    this.featuredIds = ['mango','tomato','rice','pomegranate','onion','oil','kiwi','atta'];\n\n    // stable delivery slots for the week\n    const now = new Date();\n    const names = ['Today','Tomorrow'];\n    this._days = [];\n    for(let i=0;i<5;i++){\n      const d = new Date(now); d.setDate(now.getDate()+i);\n      const label = i<2 ? names[i] : d.toLocaleDateString('en-IN',{weekday:'long'});\n      const mk=(type,time,left)=>({type,time,left});\n      this._days.push({key:'d'+i, label, date:d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}), slots:[\n        mk('Morning','7:00 – 10:00 AM', i===0?3:14),\n        mk('Afternoon','12:00 – 3:00 PM', i===0?0:16),\n        mk('Evening','5:00 – 8:00 PM', 12),\n      ]});\n    }\n  }\n\n  state = {\n    screen:'home', catSlug:null, productId:null, cart:{}, selVar:null, pdQty:1,\n    checkoutStep:1, slotKey:null, payment:'ONLINE', query:'',\n    pin:'', pinMsg:'', pinColor:'#C8A24B',\n    addr:{name:'',phone:'',line1:'',line2:'',landmark:'',city:'',pincode:''},\n    step1Err:'', toast:null, order:null,\n  };\n\n  // ---- helpers ----\n  tint(t){ return `background:radial-gradient(120% 130% at 30% 22%, ${t[0]} 0%, ${t[1]} 74%);box-shadow:inset 0 0 60px rgba(0,0,0,0.5);`; }\n  showToast(msg){ this.setState({toast:msg}); clearTimeout(this._tt); this._tt=setTimeout(()=>this.setState({toast:null}),2100); }\n  go(screen, extra={}){ if(typeof window!=='undefined'){window.scrollTo(0,0);} this.setState({screen, ...extra}); }\n  vm(p){\n    const cat=this.catBySlug[p.cat]; const v0=p.variants[0];\n    const disc=v0.mrp?Math.round((1-v0.price/v0.mrp)*100):0;\n    return { id:p.id, name:p.name, catName:cat.name, unit:v0.label, phLabel:p.ph, phStyle:this.tint(cat.tint),\n      priceStr:this.f(v0.price), mrpStr:v0.mrp?this.f(v0.mrp):'', hasMrp:!!v0.mrp,\n      discStr:disc?('-'+disc+'%'):'', hasDisc:disc>0,\n      onOpen:()=>this.openProduct(p.id), onAdd:()=>this.addToCart(v0.id) };\n  }\n  openProduct(id){ this.go('product',{productId:id, selVar:this.byId[id].variants[0].id, pdQty:1}); }\n  openCategory(slug){ this.go('category',{catSlug:slug, query:''}); }\n  addToCart(vid, qty=1){ this.setState(s=>{ const c={...s.cart}; c[vid]=(c[vid]||0)+qty; return {cart:c}; }); this.showToast('Added to cart'); }\n  chg(vid,delta){ this.setState(s=>{ const c={...s.cart}; c[vid]=(c[vid]||0)+delta; if(c[vid]<=0) delete c[vid]; return {cart:c}; }); }\n  remove(vid){ this.setState(s=>{ const c={...s.cart}; delete c[vid]; return {cart:c}; }); }\n  totals(){ let items=0,count=0; Object.entries(this.state.cart).forEach(([vid,q])=>{ const e=this.vIndex[vid]; if(e){items+=e.variant.price*q; count+=q;} }); const delivery=(items>0&&items<499)?29:0; return {items,count,delivery,grand:items+delivery}; }\n  onWhatsApp(){ const num='919876543210'; const url='https://wa.me/'+num+'?text='+encodeURIComponent('Hi Phone Se Mangao, I would like to place an order.'); if(typeof window!=='undefined') window.open(url,'_blank'); }\n\n  renderVals(){\n    const s=this.state; const t=this.totals();\n    const catLine=(slug)=>this.byCat[slug].map(p=>this.vm(p));\n    const out = {\n      isHome:s.screen==='home', isCategory:s.screen==='category', isProduct:s.screen==='product',\n      isCart:s.screen==='cart', isCheckout:s.screen==='checkout', isTracking:s.screen==='tracking',\n      cartCount:t.count, query:s.query,\n      goHome:()=>this.go('home'), goCart:()=>this.go('cart'), goShop:()=>this.openCategory('fruits'),\n      onFruits:()=>this.openCategory('fruits'), onVeg:()=>this.openCategory('vegetables'), onGrocery:()=>this.openCategory('grocery'),\n      onWhatsApp:()=>this.onWhatsApp(),\n      onSearch:(e)=>this.setState({query:e.target.value}),\n      onSearchSubmit:(e)=>{ e.preventDefault(); this.go('category',{catSlug:'search'}); },\n      itemsTotalStr:this.f(t.items), deliveryStr:t.delivery===0?'Free':this.f(t.delivery), grandTotalStr:this.f(t.grand),\n      toast:s.toast,\n    };\n\n    // HOME\n    out.slotPromise=[ {name:'Morning',time:'7:00 – 10:00 AM',cutoff:'11 PM prev. day'}, {name:'Afternoon',time:'12:00 – 3:00 PM',cutoff:'9 AM same day'}, {name:'Evening',time:'5:00 – 8:00 PM',cutoff:'2 PM same day'} ];\n    out.categoryCards=this.cats.map(c=>({name:c.name,tag:c.tag,phLabel:c.ph,phStyle:this.tint(c.tint),count:this.byCat[c.slug].length,onOpen:()=>this.openCategory(c.slug)}));\n    out.featured=this.featuredIds.map(id=>this.vm(this.byId[id]));\n    out.trust=[ {k:'30–60 min',v:'Slot-based delivery windows you choose at checkout'}, {k:'100%',v:'Return or refund on anything not fresh'}, {k:'UPI & COD',v:'Pay online securely or cash at your door'}, {k:'6 AM',v:'Fresh stock picked from the mandi each morning'} ];\n    out.pin=s.pin; out.pinMsg=s.pinMsg; out.pinColor=s.pinColor;\n    out.onPinInput=(e)=>this.setState({pin:e.target.value.replace(/\\D/g,'').slice(0,6),pinMsg:''});\n    out.onPinCheck=()=>{ const p=s.pin; if(p.length!==6){ this.setState({pinMsg:'Please enter a valid 6-digit pincode.',pinColor:'#B23B2E'}); } else { this.setState({pinMsg:'Great news — we deliver to '+p+'. Slots open now.',pinColor:'#C8A24B'}); } };\n\n    // CATEGORY / SEARCH\n    let list, title, isSearch=s.catSlug==='search';\n    if(isSearch){ const q=s.query.trim().toLowerCase(); list=this.products.filter(p=>p.name.toLowerCase().includes(q)||this.catBySlug[p.cat].name.toLowerCase().includes(q)); title=q?('Results for \"'+s.query.trim()+'\"'):'All products'; }\n    else if(s.catSlug==='all'){ list=this.products.slice(); title='All products'; }\n    else if(this.byCat[s.catSlug]){ list=this.byCat[s.catSlug]; title=this.catBySlug[s.catSlug].name; }\n    else { list=this.products.slice(); title='All products'; }\n    out.catTitle=title;\n    out.catProducts=list.map(p=>this.vm(p));\n    out.catCountStr=list.length+' item'+(list.length===1?'':'s');\n    out.catEmpty=list.length===0;\n    const tabDef=[{slug:'all',name:'All'},{slug:'fruits',name:'Fruits'},{slug:'vegetables',name:'Vegetables'},{slug:'grocery',name:'Grocery'}];\n    out.catTabs=tabDef.map(td=>{ const active=(!isSearch)&&((s.catSlug===td.slug)||(s.catSlug===null&&td.slug==='all')); return {name:td.name, onClick:()=>this.openCategory(td.slug), bg:active?'#C8A24B':'#182E24', fg:active?'#182E24':'#F3EBDC', bd:active?'#C8A24B':'#305640'}; });\n\n    // PRODUCT\n    const p=this.byId[s.productId];\n    if(p){ const cat=this.catBySlug[p.cat]; const selId=s.selVar||p.variants[0].id; const sel=p.variants.find(v=>v.id===selId)||p.variants[0];\n      const disc=sel.mrp?Math.round((1-sel.price/sel.mrp)*100):0;\n      out.d={ name:p.name, catName:cat.name, desc:p.desc, phLabel:p.ph, phStyle:this.tint(cat.tint),\n        priceStr:this.f(sel.price), mrpStr:sel.mrp?this.f(sel.mrp):'', hasMrp:!!sel.mrp, discStr:disc?('-'+disc+'% OFF'):'', hasDisc:disc>0,\n        qty:s.pdQty, onCat:()=>this.openCategory(p.cat),\n        variants:p.variants.map(v=>{ const on=v.id===selId; return {label:v.label, priceStr:this.f(v.price), onSelect:()=>this.setState({selVar:v.id}), bg:on?'#20392D':'#182E24', bd:on?'#C8A24B':'#294C3B', fg:on?'#C8A24B':'#F3EBDC'}; }),\n        onInc:()=>this.setState(x=>({pdQty:x.pdQty+1})), onDec:()=>this.setState(x=>({pdQty:Math.max(1,x.pdQty-1)})),\n        onAdd:()=>this.addToCart(selId,s.pdQty),\n        related:this.byCat[p.cat].filter(x=>x.id!==p.id).slice(0,4).map(x=>this.vm(x)),\n      };\n    } else { out.d={variants:[],related:[]}; }\n\n    // CART\n    out.cartEmpty=t.count===0; out.cartHas=t.count>0;\n    out.cartLines=Object.entries(s.cart).map(([vid,q])=>{ const e=this.vIndex[vid]; const cat=this.catBySlug[e.product.cat];\n      return {name:e.product.name, label:e.variant.label, phStyle:this.tint(cat.tint), unitStr:this.f(e.variant.price), qty:q, totalStr:this.f(e.variant.price*q), onInc:()=>this.chg(vid,1), onDec:()=>this.chg(vid,-1), onRemove:()=>this.remove(vid)}; });\n    out.showFreeHint=t.items>0&&t.items<499; out.freeHint='Add '+this.f(499-t.items)+' more for free delivery.';\n    out.goCheckout=()=>this.go('checkout',{checkoutStep:1});\n\n    // CHECKOUT\n    const step=s.checkoutStep;\n    out.isStep1=step===1; out.isStep2=step===2; out.isStep3=step===3;\n    out.steps=[{n:1,name:'Address'},{n:2,name:'Slot'},{n:3,name:'Payment'}].map(st=>{ const active=st.n===step, done=st.n<step;\n      return {n:done?'✓':st.n, name:st.name, bg:active?'#20392D':(done?'#182E24':'#182E24'), bd:active?'#C8A24B':'#294C3B', dot:active||done?'#C8A24B':'#4A6657', fg:active?'#C8A24B':'#A9B7AC'}; });\n    out.addr=s.addr;\n    const setA=(k)=>(e)=>this.setState(x=>({addr:{...x.addr,[k]:e.target.value}, step1Err:''}));\n    out.onA_name=setA('name'); out.onA_phone=setA('phone'); out.onA_line1=setA('line1'); out.onA_line2=setA('line2'); out.onA_landmark=setA('landmark'); out.onA_pin=setA('pincode');\n    const a=s.addr; const a1ok=a.name&&a.phone&&a.line1&&a.pincode;\n    out.step1BtnBg=a1ok?'#C8A24B':'#3A5346'; out.step1Cursor=a1ok?'pointer':'not-allowed'; out.step1Err=s.step1Err;\n    out.onStep1Next=()=>{ if(a1ok) this.setState({checkoutStep:2}); else this.setState({step1Err:'Please fill name, phone, address and pincode.'}); };\n    out.slotDays=this._days.map(day=>({ label:day.label, date:day.date, slots:day.slots.map(sl=>{ const key=day.key+'-'+sl.type; const on=s.slotKey===key; const full=sl.left===0;\n        return {type:sl.type, time:sl.time, key, disabled:full, cursor:full?'not-allowed':'pointer', op:full?'0.5':'1',\n          bg:on?'#20392D':(full?'#152A20':'#182E24'), bd:on?'#C8A24B':'#294C3B', fg:on?'#C8A24B':'#F3EBDC',\n          leftStr:full?'Slot full':(sl.left+' slots left'), leftColor:full?'#B23B2E':(sl.left<=4?'#C8A24B':'#94A69A'),\n          onSelect:()=>{ if(!full) this.setState({slotKey:key}); } }; }) }));\n    const slotChosen=(()=>{ if(!s.slotKey) return ''; const [dk,type]=s.slotKey.split('-'); const day=this._days.find(d=>d.key===dk); const sl=day&&day.slots.find(x=>x.type===type); return day&&sl?(day.label+', '+sl.type+' ('+sl.time+')'):''; })();\n    out.slotChosenLabel=slotChosen;\n    const s2ok=!!s.slotKey;\n    out.step2BtnBg=s2ok?'#C8A24B':'#3A5346'; out.step2Cursor=s2ok?'pointer':'not-allowed';\n    out.onStep2Back=()=>this.setState({checkoutStep:1}); out.onStep2Next=()=>{ if(s2ok) this.setState({checkoutStep:3}); };\n    out.onStep3Back=()=>this.setState({checkoutStep:2});\n    out.onlineBg=s.payment==='ONLINE'?'#20392D':'#182E24'; out.onlineBd=s.payment==='ONLINE'?'#C8A24B':'#294C3B'; out.onlineDot=s.payment==='ONLINE'?'#C8A24B':'#305640';\n    out.codBg=s.payment==='COD'?'#20392D':'#182E24'; out.codBd=s.payment==='COD'?'#C8A24B':'#294C3B'; out.codDot=s.payment==='COD'?'#C8A24B':'#305640';\n    out.onPayOnline=()=>this.setState({payment:'ONLINE'}); out.onPayCod=()=>this.setState({payment:'COD'});\n    out.placeLabel=s.payment==='ONLINE'?('Pay '+this.f(t.grand)+' securely'):('Place order · '+this.f(t.grand)+' COD');\n    out.onPlaceOrder=()=>{ const d=new Date(); const no='ORD-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(Math.floor(1000+Math.random()*9000)); this.setState({ order:{no, name:s.addr.name, slot:slotChosen, addr:s.addr, pay:s.payment, total:t.grand, lines:out.cartLines}, screen:'tracking', cart:{} }); if(typeof window!=='undefined') window.scrollTo(0,0); };\n\n    // TRACKING\n    const o=s.order;\n    out.orderNo=o?o.no:''; out.orderName=o&&o.name?(', '+o.name.split(' ')[0]):'';\n    out.trackSlot=o?o.slot:''; out.trackPay=o?(o.pay==='ONLINE'?'Paid online':'Cash on delivery'):'';\n    out.trackAddr=o?[o.addr.line1,o.addr.line2,o.addr.landmark,o.addr.pincode].filter(Boolean).join(', '):'';\n    if(o){ out.grandTotalStr=this.f(o.total); }\n    const tl=[ {title:'Order confirmed',sub:'We\\u2019ve received your order',state:'done'}, {title:'Packing your order',sub:'Fresh items being picked & weighed',state:'active'}, {title:'Out for delivery',sub:'On the way in your chosen slot',state:'todo'}, {title:'Delivered',sub:o?o.slot:'',state:'todo'} ];\n    out.timeline=tl.map((x,i)=>({ title:x.title, sub:x.sub, mark:x.state==='done'?'✓':(i+1), dot:x.state==='todo'?'#4A6657':'#C8A24B', fg:x.state==='todo'?'#7E9186':'#F3EBDC', line:i<tl.length-1?(x.state==='done'?'#C8A24B':'#305640'):'transparent', lineH:i<tl.length-1?'40px':'0' }));\n\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
